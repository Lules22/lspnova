<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>lspnova</title>
<meta name="description" content="lspnova – ein Raum, in dem KI dir begegnet.">
<style>
  :root {
    --bg: #05081a;
    --ink: #e9eefc;
    --muted: rgba(233, 238, 252, 0.55);
    --amber: #ffb547;
    --violet: #7b6cff;
    --teal: #3fd7d0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Farbige Lichtflecken hinter dem Glas */
  .aura { position: fixed; inset: -20%; filter: blur(90px); opacity: .7; pointer-events: none; }
  .aura span { position: absolute; border-radius: 50%; }
  .aura .a { width: 46vmax; height: 46vmax; left: 18%; top: 28%;
    background: radial-gradient(circle, rgba(255,181,71,.55), transparent 65%);
    animation: drift1 22s ease-in-out infinite; }
  .aura .b { width: 40vmax; height: 40vmax; left: 48%; top: 18%;
    background: radial-gradient(circle, rgba(123,108,255,.55), transparent 65%);
    animation: drift2 26s ease-in-out infinite; }
  .aura .c { width: 36vmax; height: 36vmax; left: 38%; top: 52%;
    background: radial-gradient(circle, rgba(63,215,208,.4), transparent 65%);
    animation: drift3 30s ease-in-out infinite; }
  @keyframes drift1 { 50% { transform: translate(8vmax, -4vmax) scale(1.1); } }
  @keyframes drift2 { 50% { transform: translate(-10vmax, 6vmax) scale(.9); } }
  @keyframes drift3 { 50% { transform: translate(6vmax, 5vmax) scale(1.15); } }

  .stage {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    transition: opacity .5s ease;
  }
  .stage.hidden { opacity: 0; pointer-events: none; }
  .center {
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    width: min(620px, calc(100% - 32px));
  }

  /* Liquid-Glass-Eingabezeile */
  .prompt {
    position: relative;
    width: 100%;
    height: 66px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px 0 28px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.22);
    background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.04));
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    backdrop-filter: blur(26px) saturate(180%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.4),
      inset 0 -1px 0 rgba(255,255,255,.06),
      0 24px 70px rgba(0,0,0,.45);
    color: var(--muted);
    font: inherit; font-size: 1.15rem; letter-spacing: .01em; text-align: left;
    cursor: pointer;
    overflow: hidden;
    transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s, border-color .35s;
  }
  /* Lichtkante oben, wie bei echtem Glas */
  .prompt::before {
    content: ""; position: absolute; inset: 0;
    border-radius: inherit;
    background: linear-gradient(180deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 45%);
    pointer-events: none;
  }
  .prompt:hover { border-color: rgba(255,255,255,.35); transform: translateY(-1px); }
  .prompt:focus-visible { outline: 2px solid rgba(255,255,255,.7); outline-offset: 4px; }
  .prompt.launch { transform: scale(1.06); opacity: 0; transition: transform .6s ease, opacity .6s ease; }

  .seed {
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 42% 38%, #fff6e2 0%, var(--amber) 28%, rgba(123,108,255,.75) 62%, rgba(63,215,208,0) 74%);
    box-shadow: 0 0 22px rgba(255,181,71,.55);
    animation: breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe { 50% { transform: scale(.88); box-shadow: 0 0 34px rgba(123,108,255,.6); } }

  .hint { font-size: .95rem; color: var(--muted); text-align: center; max-width: 46ch; line-height: 1.5; min-height: 1.5em; }

  .wordmark {
    position: fixed; bottom: max(22px, env(safe-area-inset-bottom)); left: 0; right: 0;
    text-align: center; font-size: .85rem; letter-spacing: .32em; color: rgba(233,238,252,.35);
  }

  canvas.gl { position: fixed; inset: 0; width: 100%; height: 100%; }

  .back {
    position: fixed; top: 16px; left: 16px; display: none;
    padding: 10px 18px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(255,255,255,.08);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    color: var(--ink); font: inherit; font-size: .95rem; cursor: pointer;
  }
  .back.visible { display: block; }

  @media (prefers-reduced-motion: reduce) {
    .aura span, .seed { animation: none; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>

<div class="aura" aria-hidden="true"><span class="a"></span><span class="b"></span><span class="c"></span></div>

<main class="stage" id="stage">
  <div class="center">
    <button class="prompt" id="prompt" type="button" aria-label="Nova in deinen Raum holen">
      <span>Mit Nova sprechen</span>
      <span class="seed" aria-hidden="true"></span>
    </button>
    <p class="hint" id="hint"></p>
  </div>
</main>

<p class="wordmark">LSPNOVA</p>
<button class="back" id="back" type="button">Zurück</button>

<script type="module">
import * as THREE from 'three';

const stage  = document.getElementById('stage');
const prompt = document.getElementById('prompt');
const hint   = document.getElementById('hint');
const back   = document.getElementById('back');

/* ---------- Renderer, Szene, Kamera ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local');
renderer.domElement.className = 'gl';
renderer.domElement.style.display = 'none';
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 50);

/* ---------- Glas-Panel (die 3D-Eingabezeile) ---------- */
const PANEL_W = 0.42, PANEL_H = 0.07;

function pillShape(w, h) {
  const r = h / 2, x = -w / 2, y = -h / 2;
  const s = new THREE.Shape();
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.absarc(x + w - r, 0, r, -Math.PI / 2, Math.PI / 2, false);
  s.lineTo(x + r, y + h);
  s.absarc(x + r, 0, r, Math.PI / 2, Math.PI * 1.5, false);
  return s;
}

const panelGeo = new THREE.ExtrudeGeometry(pillShape(PANEL_W, PANEL_H), {
  depth: 0.008, bevelEnabled: true, bevelThickness: 0.004, bevelSize: 0.004,
  bevelSegments: 5, curveSegments: 40
});
panelGeo.center();

const glassMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  uniforms: { uOpacity: { value: 0 }, uTime: { value: 0 } },
  vertexShader: /* glsl */`
    varying vec3 vN; varying vec3 vV; varying vec3 vP;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vN = normalize(normalMatrix * normal);
      vV = normalize(-mv.xyz);
      vP = position;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    uniform float uOpacity; uniform float uTime;
    varying vec3 vN; varying vec3 vV; varying vec3 vP;
    void main() {
      float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.0);
      vec3 base = vec3(0.84, 0.89, 1.0);
      vec3 iris = 0.6 + 0.4 * cos(6.2831 * (f * 0.7 + uTime * 0.04 + vec3(0.0, 0.33, 0.67)));
      float sheen = smoothstep(0.0, 0.035, vP.y) * 0.18;
      vec3 col = mix(base, iris, f) + sheen;
      float a = uOpacity * (0.10 + 0.75 * f + sheen);
      gl_FragColor = vec4(col, a);
    }`
});

/* Beschriftung auf dem Panel */
function makeLabelTexture() {
  const c = document.createElement('canvas');
  c.width = 1536; c.height = 256;
  const g = c.getContext('2d');
  g.font = '500 92px -apple-system, "Segoe UI", Roboto, system-ui, sans-serif';
  g.fillStyle = 'rgba(233,238,252,0.78)';
  g.textBaseline = 'middle';
  g.fillText('Mit Nova sprechen', 150, 132);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}
const labelMat = new THREE.MeshBasicMaterial({ map: makeLabelTexture(), transparent: true, depthWrite: false, opacity: 0 });
const label = new THREE.Mesh(new THREE.PlaneGeometry(PANEL_W, PANEL_W / 6), labelMat);
label.position.z = 0.0095;

const panelSlab = new THREE.Mesh(panelGeo, glassMat);
const panel = new THREE.Group();
panel.add(panelSlab, label);
panel.visible = false;
scene.add(panel);

/* ---------- Der Orb ---------- */
const ORB_R = 0.035;
const orbMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: {
    uOpacity: { value: 0 }, uTime: { value: 0 },
    uCore: { value: new THREE.Color(0xffb547) },
    uHue: { value: 0 }          // für das spätere Farbmorphen im Gespräch
  },
  vertexShader: /* glsl */`
    varying vec3 vN; varying vec3 vV; varying vec3 vP;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vN = normalize(normalMatrix * normal);
      vV = normalize(-mv.xyz);
      vP = position;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    uniform float uOpacity; uniform float uTime; uniform vec3 uCore; uniform float uHue;
    varying vec3 vN; varying vec3 vV; varying vec3 vP;
    void main() {
      float d = clamp(dot(normalize(vN), normalize(vV)), 0.0, 1.0);
      float f = 1.0 - d;
      vec3 rim = 0.55 + 0.45 * cos(6.2831 * (f * 0.9 + uTime * 0.06 + uHue + vec3(0.58, 0.68, 0.82)));
      float n = sin(vP.x * 9.0 + uTime * 1.3) * sin(vP.y * 8.0 - uTime * 1.1) * sin(vP.z * 10.0 + uTime * 0.9);
      vec3 core = mix(uCore, vec3(1.0, 0.97, 0.9), pow(d, 6.0));
      vec3 col = mix(rim, core, smoothstep(0.25, 0.85, d + n * 0.1));
      float a = uOpacity * clamp(0.35 + 0.8 * d, 0.0, 1.0);
      gl_FragColor = vec4(col, a);
    }`
});
const orbBody = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), orbMat);
orbBody.scale.setScalar(ORB_R);

function makeHaloTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grd.addColorStop(0.0, 'rgba(255,214,150,0.85)');
  grd.addColorStop(0.22, 'rgba(255,181,71,0.35)');
  grd.addColorStop(0.5, 'rgba(123,108,255,0.16)');
  grd.addColorStop(1.0, 'rgba(63,215,208,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const haloMat = new THREE.SpriteMaterial({ map: makeHaloTexture(), transparent: true, depthWrite: false, opacity: 0 });
const halo = new THREE.Sprite(haloMat);
halo.scale.setScalar(ORB_R * 7);

const orb = new THREE.Group();
orb.add(halo, orbBody);
orb.visible = false;
scene.add(orb);

/* ---------- Ablauf ---------- */
let mode = 'idle';          // 'idle' | 'xr' | 'preview'
let placed = false;
let xrFrames = 0;
let t0 = 0;
const anchor   = new THREE.Vector3();
const startPos = new THREE.Vector3();
const restPos  = new THREE.Vector3();
const toward   = new THREE.Vector3();
const target   = new THREE.Vector3();
const clock = new THREE.Clock();

const clamp01 = x => Math.min(1, Math.max(0, x));
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const easeInOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

function resetScene() {
  placed = false; xrFrames = 0;
  panel.visible = false; orb.visible = false;
  glassMat.uniforms.uOpacity.value = 0;
  labelMat.opacity = 0;
  orbMat.uniforms.uOpacity.value = 0;
  haloMat.opacity = 0;
}

/* Panel vor dem Blick des Nutzers platzieren */
function placeInFront(cam) {
  const camPos = new THREE.Vector3();
  const camQuat = new THREE.Quaternion();
  cam.getWorldPosition(camPos);
  cam.getWorldQuaternion(camQuat);

  const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camQuat);
  fwd.y = 0;
  if (fwd.lengthSq() < 1e-4) fwd.set(0, 0, -1);
  fwd.normalize();

  const eyeY = camPos.y - 0.06;
  startPos.copy(camPos).addScaledVector(fwd, 0.42).setY(eyeY);
  restPos.copy(camPos).addScaledVector(fwd, 0.78).setY(eyeY);
  anchor.copy(restPos);

  panel.position.copy(startPos);
  panel.lookAt(camPos.x, eyeY, camPos.z);
  panel.scale.set(0.9, 0.9, 0.9);
  panel.visible = true;

  orb.position.copy(restPos);
  orb.visible = true;

  placed = true;
  t0 = clock.getElapsedTime();
}

function update(now) {
  if (!placed) return;
  const t = now - t0;

  // 1) Zeile löst sich und gleitet in den Raum
  const pIn = easeOut(seg(t, 0, 0.9));
  panel.position.lerpVectors(startPos, restPos, pIn);
  glassMat.uniforms.uOpacity.value = pIn * (1 - seg(t, 2.25, 2.7));
  labelMat.opacity = seg(t, 0.25, 0.8) * (1 - seg(t, 1.6, 1.95));

  // 2) Zeile zieht sich zusammen
  const squeeze = easeInOut(seg(t, 1.7, 2.35));
  const sx = THREE.MathUtils.lerp(1, PANEL_H / PANEL_W, squeeze);
  const shrink = 1 - 0.55 * easeInOut(seg(t, 2.2, 2.7));
  const base = THREE.MathUtils.lerp(0.9, 1, pIn) * shrink;
  panel.scale.set(sx * base, base, base);
  panel.visible = t < 2.75;

  // 3) Orb entsteht
  const born = seg(t, 2.15, 2.8);
  const s = Math.max(0.0001, easeOutBack(born));
  orbBody.scale.setScalar(ORB_R * s);
  halo.scale.setScalar(ORB_R * 7 * Math.min(1, s));
  orbMat.uniforms.uOpacity.value = clamp01(born * 1.4);
  haloMat.opacity = clamp01(born * 1.2) * (0.85 + 0.15 * Math.sin(now * 1.7));

  // 4) Orb treibt sanft durch den Raum
  if (t > 2.8) {
    const amp = easeInOut(seg(t, 2.8, 5.5));
    const k = t - 2.8;
    target.set(
      Math.sin(k * 0.23) * 0.32 + Math.sin(k * 0.61 + 1.3) * 0.08,
      Math.sin(k * 0.31 + 0.7) * 0.12 + Math.sin(k * 0.97) * 0.03 + 0.06,
      Math.sin(k * 0.17 + 2.1) * 0.22
    ).multiplyScalar(amp).add(anchor);
    toward.copy(target).sub(orb.position).multiplyScalar(0.035);
    orb.position.add(toward);
  } else {
    orb.position.copy(panel.position);
  }
}

renderer.setAnimationLoop(() => {
  const now = clock.getElapsedTime();
  glassMat.uniforms.uTime.value = now;
  orbMat.uniforms.uTime.value = now;

  if (mode === 'xr') {
    xrFrames++;
    // Die XR-Kamera kennt ihre Position erst nach den ersten Frames
    if (!placed && xrFrames > 3) placeInFront(renderer.xr.getCamera());
  }
  if (mode === 'idle') return;
  update(now);
  renderer.render(scene, camera);
});

/* ---------- Start, Ende, Vorschau ---------- */
let arSupported = false;

async function detect() {
  try {
    arSupported = !!navigator.xr && await navigator.xr.isSessionSupported('immersive-ar');
  } catch (e) { arSupported = false; }
  hint.textContent = arSupported
    ? 'Tippe auf die Zeile, um Nova in deinen Raum zu holen.'
    : 'Volle Wirkung in AR: Öffne lspnova.com im Browser der Meta Quest 3. Hier siehst du eine Vorschau.';
}
detect();

async function startAR() {
  const session = await navigator.xr.requestSession('immersive-ar', {
    optionalFeatures: ['local-floor', 'hand-tracking']
  });
  resetScene();
  await renderer.xr.setSession(session);
  mode = 'xr';
  stage.classList.add('hidden');
  session.addEventListener('end', () => {
    mode = 'idle';
    resetScene();
    prompt.classList.remove('launch');
    stage.classList.remove('hidden');
  });
}

function startPreview() {
  resetScene();
  camera.position.set(0, 1.6, 0);
  camera.quaternion.identity();
  camera.updateMatrixWorld();
  mode = 'preview';
  stage.classList.add('hidden');
  renderer.domElement.style.display = 'block';
  back.classList.add('visible');
  placeInFront(camera);
}

function stopPreview() {
  mode = 'idle';
  resetScene();
  renderer.domElement.style.display = 'none';
  back.classList.remove('visible');
  prompt.classList.remove('launch');
  stage.classList.remove('hidden');
}

prompt.addEventListener('click', async () => {
  prompt.classList.add('launch');
  if (arSupported) {
    try { await startAR(); }
    catch (e) {
      console.error(e);
      prompt.classList.remove('launch');
      hint.textContent = 'AR konnte nicht gestartet werden. Erlaube den Zugriff auf den Raum und versuche es nochmal.';
    }
  } else {
    setTimeout(startPreview, 350);
  }
});

back.addEventListener('click', stopPreview);

window.addEventListener('resize', () => {
  if (renderer.xr.isPresenting) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
